<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    width: 1080px;
    height: 1920px;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 130px;
  }
  .brand-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 35px;
  }
  .brand-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.8);
  }
  .brand-name {
    margin-top: 10px;
    font-size: 26px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9);
  }
  .threads-card {
    width: 820px;
    background: #101010;
    border-radius: 18px;
    padding: 22px 24px;
    border: 1px solid #282828;
    box-shadow: 0 10px 36px rgba(0, 0, 0, 0.75);
    color: #f3f5f7;
  }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .user-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .user-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }
  .user-names {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .username {
    font-size: 20px;
    font-weight: 700;
    color: #f3f5f7;
  }
  .dot {
    color: #71767b;
    font-size: 15px;
  }
  .time-ago {
    color: #71767b;
    font-size: 15px;
    font-weight: 400;
  }
  .top-right-icons {
    display: flex;
    align-items: center;
    gap: 14px;
    color: #71767b;
  }
  .post-text {
    font-size: 24px;
    font-weight: 400;
    line-height: 1.45;
    color: #f3f5f7;
    margin-bottom: 14px;
    word-break: break-word;
    letter-spacing: -0.2px;
  }
  .post-media-container {
    width: 100%;
    border-radius: 14px;
    border: 1px solid #282828;
    overflow: hidden;
    margin-bottom: 14px;
    background: #000000;
  }
  .post-media-img {
    width: 100%;
    max-height: 480px;
    object-fit: contain;
    display: block;
  }
  .actions-row {
    display: flex;
    align-items: center;
    gap: 24px;
    padding-top: 4px;
    color: #f3f5f7;
  }
  .action-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 15px;
    color: #71767b;
    font-weight: 500;
  }
  .action-btn svg {
    width: 22px;
    height: 22px;
    stroke: #f3f5f7;
    stroke-width: 1.8;
    fill: none;
  }
</style>
</head>

</html>
